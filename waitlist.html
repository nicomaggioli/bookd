<script>/* canvas: page stays still */
(function () {
  var still = function () {
    var inFrame = false; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
    var h = window.innerHeight || 0, page = document.documentElement.scrollHeight || 0;
    return h > 2000 || (inFrame && page > 400 && h >= page * 0.95);
  };
  var css = document.createElement('style');
  css.textContent = 'html.oncanvas *,html.oncanvas *::before,html.oncanvas *::after{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important}';
  document.head.appendChild(css);
  var check = function () {
    var on = still();
    document.documentElement.classList.toggle('oncanvas', on);
    if (on) Array.prototype.forEach.call(document.querySelectorAll('video'), function (v) { if (!v.paused) v.pause(); });
  };
  document.addEventListener('play', function (e) { if (e.target && e.target.pause && still()) e.target.pause(); }, true);
  check(); window.addEventListener('load', check); window.addEventListener('resize', check);
  [500, 1500, 4000].forEach(function (ms) { setTimeout(check, ms); });
})();
</script>

<style>
/* big screens: wider than 1440 the whole page scales up from the 1440 layout, so 1920, 2000 or 2560 look like 1440, only bigger.
   --bz is the scale. It never goes under 1. A wide but short window scales by its height instead (the page keeps at least 680 of its own pixels of height) and the layout stretches sideways the way it used to.
   Browsers that cannot divide one length by another skip the whole block and keep the stretchy layout. */
:root{--vw:1vw;--vh:1vh;--svh:1svh;--dvh:1dvh;--lvh:1lvh}
@supports (zoom:calc(100vw / 1440px)){
@media (min-width:1441px){
  :root{--bz:max(1, min(calc(100vw / 1440px), calc(100vh / 680px)));--vw:calc(1vw / var(--bz));--vh:calc(1vh / var(--bz));--svh:calc(1svh / var(--bz));--dvh:calc(1dvh / var(--bz));--lvh:calc(1lvh / var(--bz))}
  html{zoom:var(--bz)}
}
}

/* v6 shell: shared by every v6 page. Same tokens and components as index.html. */
body{margin:0;background:#000000;font-family:'Inter',Helvetica,Arial,sans-serif;color:#ffffff;text-wrap:pretty}
h1,h2,h3,h4{text-wrap:balance}
a{color:inherit}
:root{--r-card:20px;--r-bar:16px;--r-field:14px;--gut:clamp(16px,calc(4 * var(--vw)),48px)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible,[tabindex]:focus-visible{outline:2px solid #ff3b2f;outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--gut);box-sizing:border-box}
/* type */
.h1{margin:0;font-size:clamp(48px,calc(7 * var(--vw)),112px);line-height:.88;font-weight:700;letter-spacing:-0.065em;text-wrap:balance}
.h2{margin:0;font-size:clamp(44px,calc(6 * var(--vw)),92px);line-height:.9;font-weight:700;letter-spacing:-0.065em;text-wrap:balance}
.h3{margin:0;font-size:clamp(24px,calc(2.4 * var(--vw)),32px);line-height:1;font-weight:700;letter-spacing:-0.045em}
.lede{margin:0;font-size:clamp(17px,calc(1.4 * var(--vw)),20px);line-height:1.45;color:#fffde9;max-width:34em}
.muted{color:#a2a5a4}
.skip{position:absolute;left:16px;top:-80px;z-index:70;background:#d31110;color:#ffffff;padding:10px 14px;font-weight:700;text-decoration:none;border-radius:999px}
.skip:focus{top:12px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}

/* ===== Waitlist6: the site before it opens. Plain on purpose (Nov 11): one line, one email box, one button, and a lot of empty space.
   Behind it the dancing video fills the page under a dark shade, so the words stay easy to read. The shade lifts a little once you are on the list. ===== */
.wl-page{position:relative;min-height:calc(100 * var(--vh));min-height:calc(100 * var(--svh));display:flex;flex-direction:column;overflow:hidden;background:#000000}
/* the video and its shade sit behind everything, edge to edge */
.wl-bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#000000}
.wl-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.wl-shade{position:absolute;inset:0;background:radial-gradient(ellipse 62% 56% at 50% 46%,rgba(0,0,0,.86) 0%,rgba(0,0,0,.78) 55%,rgba(0,0,0,.68) 100%),linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 72%,rgba(0,0,0,.66) 100%);transition:opacity 1.1s ease}
.wl-on .wl-shade{opacity:.9}
.wl-top{position:relative;z-index:2;display:flex;justify-content:center;padding:clamp(22px,calc(4.4 * var(--svh)),44px) var(--gut) 0}
.wl{position:relative;z-index:1;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(40px,calc(8 * var(--svh)),96px) var(--gut) clamp(72px,calc(17 * var(--svh)),190px)}
.wl-h{margin:0;font-size:clamp(42px,min(calc(4 * var(--vw) + 28px),calc(11 * var(--svh))),92px);line-height:.94;font-weight:700;letter-spacing:-0.065em;color:#fffde9;text-wrap:balance;outline:none}
/* the headline takes focus after a press so a screen reader reads the result; it is not a control, so it shows no ring */
.wl-h:focus,.wl-h:focus-visible{outline:none}
.wl-sub{margin:clamp(12px,calc(2 * var(--svh)),20px) 0 0;max-width:24em;font-size:clamp(16px,calc(1.3 * var(--vw)),19px);line-height:1.4;color:#ffffff}
.wl-form{width:min(460px,100%);margin:clamp(26px,calc(4.6 * var(--svh)),44px) 0 0}
/* one pill: the box and the button share it */
.wl-pill{display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:#f2f2f0;transition:background .15s,box-shadow .15s}
.wl-pill:focus-within{background:#ffffff;box-shadow:0 0 0 3px #d31110}
.wl-pill input{flex:1 1 auto;min-width:0;height:52px;margin:0;padding:0 8px 0 20px;border:0;border-radius:999px;background:transparent;font:400 18px 'Inter',sans-serif;letter-spacing:-0.01em;color:#000000;outline:none;-webkit-appearance:none;appearance:none}
.wl-pill input::placeholder{color:#636665;opacity:1}
.wl-go{flex:none;min-height:52px;padding:0 26px;border:0;border-radius:999px;background:#d31110;color:#ffffff;font:700 17px 'Inter',sans-serif;letter-spacing:-0.02em;cursor:pointer;white-space:nowrap;transition:background .15s}
.wl-go:active{transform:translateY(1px)}
.wl-go[aria-disabled="true"]{opacity:.6;cursor:default}
.wl-go:focus-visible{outline:2px solid #000000;outline-offset:2px}
.wl-note{margin:14px 0 0;min-height:19px;font-size:13px;line-height:1.45;color:#f0f0ee}
.wl-note a{color:#ffffff;font-weight:700;text-underline-offset:2px}
/* red letters would not hold up over the video, so a problem is said in white on a red pill */
.wl-err{display:inline-block;margin-top:12px;padding:7px 14px;border-radius:999px;background:#d31110;color:#ffffff;font-weight:700}
.wl-again{margin:clamp(20px,calc(3.4 * var(--svh)),32px) 0 0;min-height:48px;padding:0 24px;border:0;border-radius:999px;background:#ffffff;color:#000000;font:700 15px 'Inter',sans-serif;letter-spacing:-0.01em;cursor:pointer;transition:background .15s,color .15s}
.wl-again:active{transform:translateY(1px)}
.wl-again:focus-visible{outline:2px solid #ff3b2f;outline-offset:3px}
/* hover: the red Join sits on the white pill, so it turns black; the white pill sits on the dark veil, so it turns red; the Privacy link turns the small-text red */
@media (hover: hover) and (pointer: fine){.wl-go:hover{background:#000000}.wl-again:hover{background:#d31110;color:#ffffff}.wl-note a:hover{color:#ff3b2f}}
@media (max-width:420px){.wl-pill input{padding-left:16px;font-size:17px}.wl-go{padding:0 20px}}
</style>

@media print{body::after{display:none}}
</style>

<main id="main" class="wl" aria-labelledby="wl-h">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
// Waitlist6: the page the site shows before launch. One job: take an email for the list.
// On the design canvas this is a mockup: the button only swaps the words.
// On the site with the backend connected (window.BOOKD.ready) it adds the email for real (web/api/waitlist.js).
// On the site with no backend yet it never pretends: it says the list is not open and that nothing was saved.
var WL_EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
function wlLive() {
  var b = typeof window !== 'undefined' ? window.BOOKD : null;
  return b && b.ready && b.waitlist ? b.waitlist : null;
}
// The built site says demo: false in bookd-config.js. The canvas has no config, so it keeps the mockup.
function wlSoon() {
  var c = typeof window !== 'undefined' ? window.BOOKD_CONFIG : null;
  return !!(c && c.demo === false) && !wlLive();
}
function wlFail(code) {
  if (code === 'rate') return 'Too many tries. Give it a\u00a0minute.';
  if (code === 'offline') return "Couldn't reach BOOKD. Check your\u00a0connection.";
  if (code === 'invalid') return "That email doesn't look\u00a0right.";
  return 'Something went wrong. Nothing was saved, so try\u00a0again.';
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var self = this;
    // done: '' the form, 'in' on the list, 'soon' the list is not open yet
    this.reduce = !!(typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    this.state = { email: '', bad: false, fail: '', busy: false, done: '' };
    this.vid = null;
    this.vidRef = function (el) {
      if (self.vid && self.vid !== el && !self.vid.paused) self.vid.pause();
      self.vid = el; if (el) { el.muted = true; if (!self.reduce && el.paused) { var p = el.play(); if (p && p.catch) p.catch(function () {}); } }
    };
    this.emailEl = null; this.headEl = null; this.wantEmail = false; this.wantHead = false;
    this.emailRef = function (el) { self.emailEl = el; if (el && self.wantEmail) { self.wantEmail = false; if (el.focus) el.focus(); } };
    this.headRef = function (el) { self.headEl = el; };
  }
  // the new headline takes focus after the press, so a screen reader reads the result
  componentDidUpdate() {
    if (this.wantHead && this.headEl && this.headEl.focus) { this.wantHead = false; this.headEl.focus(); }
  }
  componentWillUnmount() {
    if (this.vid && !this.vid.paused) this.vid.pause();
  }
  renderVals() {
    var self = this, s = this.state, soon = wlSoon();
    var isIn = s.done === 'in', isSoon = s.done === 'soon', err = s.bad || !!s.fail;
    return {
      pageCls: isIn ? 'wl-page wl-on' : 'wl-page',
      head: isIn ? "You're on the\u00a0list." : isSoon ? 'Not open\u00a0yet.' : 'Join the\u00a0waitlist.',
      sub: isIn ? "We'll email you when BOOKD\u00a0opens." : isSoon ? 'Nothing was saved. Check back in a few\u00a0days.' : 'Be first to know when BOOKD\u00a0opens.',
      formOn: !s.done, doneOn: !!s.done, againLabel: isIn ? 'Add another email' : 'Back',
      email: s.email, emailBad: s.bad ? 'true' : 'false',
      busy: s.busy ? 'true' : 'false', goLabel: s.busy ? 'One sec' : 'Join',
      note: s.bad ? (s.email.trim() ? "That email doesn't look\u00a0right." : 'Add your email\u00a0first.') : s.fail ? wlFail(s.fail) : soon ? '' : 'One email when we\u00a0open.',   // no line under the box while the list is not open (Nov 11); the page still says so after the press
      noteCls: err ? 'wl-note wl-err' : 'wl-note', noteRole: err ? 'alert' : 'note', privacyOn: !err && !soon,
      emailRef: this.emailRef, headRef: this.headRef, vidRef: this.vidRef,
      setEmail: function (e) { self.setState({ email: e.target.value, bad: false, fail: '' }); },
      again: function () { self.wantEmail = true; self.setState({ done: '', email: '', bad: false, fail: '', busy: false }); },
      join: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        var st = self.state, em = st.email.trim();
        if (st.busy) return;
        if (!WL_EMAIL.test(em) || em.length > 200) {
          self.setState({ bad: true, fail: '' });
          if (self.emailEl && self.emailEl.focus) self.emailEl.focus();
          return;
        }
        var api = wlLive();
        if (!api) { self.wantHead = true; self.setState({ done: wlSoon() ? 'soon' : 'in', bad: false, fail: '' }); return; }
        self.setState({ busy: true, bad: false, fail: '' });
        api.join({ email: em }).then(function (r) {
          if (r && r.ok) { self.wantHead = true; self.setState({ busy: false, done: 'in' }); }
          else self.setState({ busy: false, fail: (r && r.code) || 'unknown' });
        });
      }
    };
  }
}
</script>
