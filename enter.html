/* The code page: where a beta tester comes in while the site sits behind the waitlist. One job, so it is plain:
   the logo, one line, one box, one button. The gate itself is the small script the build puts at the top of every other page. */
html,body{height:100%}
body{margin:0;background:#000000;color:#ffffff;font-family:'Inter',Helvetica,Arial,sans-serif;text-wrap:pretty}
.pg{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:clamp(20px,5vw,48px)}
.logo{display:block;width:124px;line-height:0}
.logo svg{width:100%;height:auto;fill:#ffffff}
main{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:440px;margin:0 auto;padding:48px 0 72px}
h1{margin:0;font-size:clamp(44px,11vw,72px);line-height:.95;font-weight:700;letter-spacing:-0.055em;text-wrap:balance;outline:none}
.sub{margin:18px 0 28px;font-size:18px;line-height:1.45;color:#a2a5a4}
.pill{display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:#ffffff}
.pill:focus-within{box-shadow:0 0 0 3px #ff3b2f}
.pill input{flex:1 1 auto;min-width:0;height:52px;margin:0;padding:0 8px 0 20px;border:0;border-radius:999px;background:transparent;font:400 18px 'Inter',sans-serif;color:#000000;outline:none;-webkit-appearance:none;appearance:none}
.pill input::placeholder{color:rgba(0,0,0,.6);opacity:1}
.go{flex:none;min-height:52px;padding:0 26px;border:0;border-radius:999px;background:#d31110;color:#ffffff;font:700 17px 'Inter',sans-serif;letter-spacing:-0.02em;cursor:pointer;white-space:nowrap;transition:background .15s}
.go:active{transform:translateY(1px)}
.go[aria-disabled="true"]{opacity:.6;cursor:default}
.go:focus-visible{outline:2px solid #000000;outline-offset:2px}
.note{margin:12px 0 0;min-height:22px;font-size:15px;line-height:1.45;color:#ff3b2f;font-weight:700}
.back{align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:20px;padding:0 18px;border-radius:999px;background:#2f2f31;color:#ffffff;font:700 15px/1.1 'Inter',sans-serif;text-decoration:none;transition:background .15s,color .15s}
a{text-decoration:none}
a:focus-visible{outline:2px solid #ff3b2f;outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
/* a hovered button goes one shade deeper in its own color: no white on white, and no outline */
@media (hover:hover) and (pointer:fine){.go:hover{background:#a50d0c;color:#ffffff}.back:hover{filter:brightness(.88)}}
@media (max-width:420px){.pill input{padding-left:14px;font-size:16px}.go{padding:0 18px}}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms !important}}
</style>
<style>.back{background:#fffde9;color:#000000}

<h1 id="h" tabindex="-1">Got a&nbsp;code?</h1>
<p class="sub">BOOKD is in private testing. Enter your code to come&nbsp;in.</p>
<form id="f" novalidate aria-labelledby="h">
<div class="pill">
<label class="vh" for="code">Code</label>
<input id="code" type="text" name="code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Your code" aria-describedby="note">

</form>

<script>
(function () {
  var HASH = '3c9476c5cc468daff8e2207fb3ae7306f4b00aa5a5c9d17fa0042f1238cd67b1', KEY = 'bookd.beta', NEXT = 'bookd.beta.next';
  var f = document.getElementById('f'), box = document.getElementById('code'), go = document.getElementById('go'), note = document.getElementById('note');
  // where to go once in: the page the gate turned this visitor away from (a link from a BOOKD email, say), or the homepage
  function onward() {
    var to = '';
    try { to = sessionStorage.getItem(NEXT) || ''; sessionStorage.removeItem(NEXT); } catch (e) {}
    if (!/^[a-z0-9-]+\.html([?#].*)?$/.test(to) || /^(enter|waitlist)\.html/.test(to)) to = 'index.html';
    location.replace(to);
  }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  // already in on this device: straight through
  try { if (HASH && localStorage.getItem(KEY) === HASH) { onward(); return; } } catch (e) {}
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = box.value.trim().toLowerCase();
    if (go.getAttribute('aria-disabled') === 'true') return;
    if (!v) { note.textContent = 'Add your code first.'; box.focus(); return; }
    if (!window.crypto || !crypto.subtle) { note.textContent = "This browser can't check the code. Try a newer one."; return; }
    go.setAttribute('aria-disabled', 'true'); note.textContent = '';
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function (d) {
      go.removeAttribute('aria-disabled');
      if (hex(d) !== HASH) { note.textContent = "That's not the code. Check it and try again."; box.focus(); box.select(); return; }
      try { localStorage.setItem(KEY, HASH); } catch (err) { note.textContent = "This browser won't remember the code. Turn off private mode and try again."; return; }
      onward();
    }, function () { go.removeAttribute('aria-disabled'); note.textContent = "Something went wrong. Try again."; });
  });
  box.addEventListener('input', function () { note.textContent = ''; });
})();
</script>
